services:
  app:
    build: .
    image: melke-app:latest
    container_name: melke-app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Внутри сети compose база доступна по имени сервиса, а не через порт хоста.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Кэш модели эмбеддингов: без него ~2 ГБ скачиваются заново после пересоздания контейнера.
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    container_name: melke-db
    ports:
      # Для индексации RAG с хоста: python -m rag.cli index (POSTGRES_PORT=5433 в .env).
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Существующий том с каталогом и индексом RAG: данные не пересоздаются.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pg-data:
    name: d953df91393fed8fef6da15c57bd3f92e05861fc3175926582cdc6a35b3a524e
    external: true
  hf-cache:
